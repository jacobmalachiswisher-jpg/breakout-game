<!DOCTYPE html>
<html>
<head>
<title>Master’s Game Hub</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
  }

  header {
    background: #222;
    padding: 20px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  /* Search Bar */
  #search-container {
    text-align: center;
    margin: 20px;
  }

  #search {
    width: 60%;
    padding: 12px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    outline: none;
  }

  .section-title {
    font-size: 26px;
    margin: 20px;
    border-left: 5px solid #0ff;
    padding-left: 10px;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    padding: 20px;
  }

  .game-card {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    transition: 0.2s;
    border: 1px solid #333;
  }

  .game-card:hover {
    transform: scale(1.05);
    border-color: #0ff;
  }

  a {
    color: #0ff;
    text-decoration: none;
    font-size: 18px;
  }
</style>
</head>
<body>

<header>Master’s Game Hub</header>

<!-- SEARCH BAR -->
<div id="search-container">
  <input type="text" id="search" placeholder="Search for a game...">
</div>

<h2 class="section-title">Popular Games</h2>
<div class="game-grid" id="game-list">

  <div class="game-card" data-name="Slope">
    <a href="https://example.com/slope" target="_blank">Slope</a>
  </div>

  <div class="game-card" data-name="Basket Random">
    <a href="https://example.com/basket-random" target="_blank">Basket Random</a>
  </div>

  <div class="game-card" data-name="Run 3">
    <a href="https://example.com/run-3" target="_blank">Run 3</a>
  </div>

  <div class="game-card" data-name="Flappy Bird">
    <a href="https://example.com/flappy-bird" target="_blank">Flappy Bird</a>
  </div>

  <div class="game-card" data-name="Chess">
    <a href="https://example.com/chess" target="_blank">Chess</a>
  </div>

  <div class="game-card" data-name="2048">
    <a href="https://example.com/2048" target="_blank">2048</a>
  </div>

  <div class="game-card" data-name="Stack">
    <a href="https://example.com/stack" target="_blank">Stack</a>
  </div>

  <!-- Your Breakout Game -->
  <div class="game-card" data-name="Breakout Game">
    <a href="breakout-game/index.html" target="_blank">Breakout Game</a>
  </div>

  <!-- Your Pong Game -->
  <div class="game-card" data-name="Pong">
    <a href="pong-game/index.html" target="_blank">Pong</a>
  </div>

</div>

<script>
  // SEARCH FUNCTION
  const searchInput = document.getElementById("search");
  const gameCards = document.querySelectorAll(".game-card");

  searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();

    gameCards.forEach(card => {
      const name = card.getAttribute("data-name").toLowerCase();
      card.style.display = name.includes(query) ? "block" : "none";
    });
  });
</script>

</body>
</html>
