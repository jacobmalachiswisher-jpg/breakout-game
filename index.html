<!DOCTYPE html>
<html>
<head>
<title>Breakout Game</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: sans-serif;

    /* Prevent scrolling on iPhone */
    touch-action: none;
    overscroll-behavior: none;
  }

  #game {
    background: #000;
    display: block;
    margin: auto;
    border: 2px solid white;
  }

  #controls {
    text-align: center;
    margin-top: 10px;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 5px;
  }
</style>
</head>
<body>

<h1 style="text-align:center;">Breakout Game</h1>
<p id="info" style="text-align:center;">Press Start to play.</p>

<canvas id="game" width="600" height="400"></canvas>

<div id="controls">
  <button id="startBtn">Start</button>
  <button id="restartBtn">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

// Game state
let gameState = "idle";
let score = 0;
let lives = 3;
let level = 1;

// Paddle
const paddle = {
  width: 90,
  height: 12,
  x: canvas.width / 2 - 45,
  y: canvas.height - 30,
  dx: 0,
  speed: 7
};

// Ball
const ball = {
  x: canvas.width / 2,
  y: canvas.height - 60,
  size: 8,
  dx: 4,
  dy: -4,
  speed: 5
};

// Bricks
const rows = 6;
const cols = 9;
const brickWidth = 55;
const brickHeight = 18;
const brickPadding = 8;
const offsetTop = 40;
const offsetLeft = 30;
let bricks = [];

// Input
let keys = {};
let touchX = null;
let isTouching = false;

// Create bricks
function createBricks() {
  bricks = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      bricks.push({
        x: offsetLeft + c * (brickWidth + brickPadding),
        y: offsetTop + r * (brickHeight + brickPadding),
        strength: Math.floor(Math.random() * (2 + level)) + 2,
        explosive: Math.random() < 0.15
      });
    }
  }
}

function getBrickColor(brick) {
  if (brick.explosive) return "cyan";
  if (brick.strength >= 6) return "#ff0000";
  if (brick.strength >= 4) return "#ff6600";
  if (brick.strength >= 2) return "#ffcc00";
  return "#ffee88";
}

function explode(brick) {
  const radius = 110;
  bricks.forEach((b) => {
    if (b.strength <= 0) return;
    const dx = (b.x + brickWidth / 2) - (brick.x + brickWidth / 2);
    const dy = (b.y + brickHeight / 2) - (brick.y + brickHeight / 2);
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < radius) {
      score += b.strength * 10;
      b.strength = 0;
    }
  });
}

function resetBallAndPaddle() {
  paddle.x = canvas.width / 2 - paddle.width / 2;
  paddle.dx = 0;
  ball.x = canvas.width / 2;
  ball.y = canvas.height - 60;
  ball.dx = (Math.random() < 0.5 ? -1 : 1) * ball.speed;
  ball.dy = -ball.speed;
}

function startGame() {
  if (gameState === "playing") return;
  gameState = "playing";
  info.textContent = "Use ← → or touch to move.";
}

function restartGame() {
  score = 0;
  lives = 3;
  level = 1;
  ball.speed = 5;
  createBricks();
  resetBallAndPaddle();
  gameState = "idle";
  info.textContent = "Press Start to play.";
}

document.addEventListener("keydown", (e) => { keys[e.key] = true; });
document.addEventListener("keyup", (e) => { keys[e.key] = false; });

// TOUCH CONTROLS
canvas.addEventListener("touchstart", (e) => {
  isTouching = true;
  touchX = e.touches[0].clientX;
});

canvas.addEventListener("touchmove", (e) => {
  if (!isTouching) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;

  paddle.x = x - paddle.width / 2;

  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.width > canvas.width)
    paddle.x = canvas.width - paddle.width;
});

canvas.addEventListener("touchend", () => {
  isTouching = false;
});

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", restartGame);

function update() {
  if (gameState === "playing") {

    // Keyboard movement when NOT touching
    if (!isTouching) {
      if (keys["ArrowLeft"] || keys["a"]) paddle.dx = -paddle.speed;
      else if (keys["ArrowRight"] || keys["d"]) paddle.dx = paddle.speed;
      else paddle.dx = 0;
    } else {
      paddle.dx = 0;
    }

    paddle.x += paddle.dx;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > canvas.width)
      paddle.x = canvas.width - paddle.width;

    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.x <= 0) { ball.x = 0; ball.dx *= -1; }
    if (ball.x + ball.size >= canvas.width) { ball.x = canvas.width - ball.size; ball.dx *= -1; }
    if (ball.y <= 0) { ball.y = 0; ball.dy *= -1; }

    if (
      ball.y + ball.size >= paddle.y &&
      ball.y + ball.size <= paddle.y + paddle.height + 10 &&
      ball.x + ball.size >= paddle.x &&
      ball.x <= paddle.x + paddle.width
    ) {
      const hitPoint =
        (ball.x + ball.size / 2 - (paddle.x + paddle.width / 2)) /
        (paddle.width / 2);
      ball.dx = hitPoint * ball.speed;
      ball.dy = -Math.abs(ball.dy);
      ball.y = paddle.y - ball.size - 1;
    }

    for (let brick of bricks) {
      if (brick.strength <= 0) continue;

      if (
        ball.x < brick.x + brickWidth &&
        ball.x + ball.size > brick.x &&
        ball.y < brick.y + brickHeight &&
        ball.y + ball.size > brick.y
      ) {
        const ballCenterX = ball.x + ball.size / 2;
        const ballCenterY = ball.y + ball.size / 2;
        const brickCenterX = brick.x + brickWidth / 2;
        const brickCenterY = brick.y + brickHeight / 2;
        const dx = ballCenterX - brickCenterX;
        const dy = ballCenterY - brickCenterY;

        if (Math.abs(dx) > Math.abs(dy)) ball.dx *= -1;
        else ball.dy *= -1;

        if (brick.explosive) explode(brick);
        else { brick.strength--; score += 10; }

        break;
      }
    }

    if (ball.y > canvas.height) {
      lives--;
      if (lives <= 0) {
        gameState = "gameover";
        info.textContent = "Game Over. Press Restart.";
      } else resetBallAndPaddle();
    }

    // LEVEL UP — reset lives and wait for Start
    if (bricks.every((b) => b.strength <= 0)) {
      level++;
      ball.speed += 0.5;

      lives = 3; // RESET LIVES EACH LEVEL

      createBricks();
      resetBallAndPaddle();

      gameState = "idle";
      info.textContent = "Level " + level + "! Press Start.";
    }
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

  ctx.fillStyle = "#00ffcc";
  ctx.fillRect(ball.x, ball.y, ball.size, ball.size);

  bricks.forEach((brick) => {
    if (brick.strength > 0) {
      ctx.save();
      ctx.fillStyle = getBrickColor(brick);
      if (brick.explosive) {
        ctx.shadowColor = "cyan";
        ctx.shadowBlur = 15;
      }
      ctx.fillRect(brick.x, brick.y, brickWidth, brickHeight);
      ctx.restore();
    }
  });

  ctx.fillStyle = "#ffffff";
  ctx.font = "14px sans-serif";
  ctx.fillText(`Score: ${score}`, 10, 18);
  ctx.fillText(`Lives: ${lives}`, canvas.width - 80, 18);
  ctx.fillText(`Level: ${level}`, canvas.width / 2 - 30, 18);
}

createBricks();
resetBallAndPaddle();
update();
</script>

</body>
</html>
